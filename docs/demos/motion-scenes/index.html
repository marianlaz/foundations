<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historias del Akasha</title>
<meta name="description" content="Una historia ilustrada, contada por el Gordo, sobre cómo funciona la mente de un LLM: del impulso eléctrico al Akasha, y de vuelta a la pantalla de tu celular.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
/* One vertical scroll: prose in a reading column, each scene dissolving into the night between passages.
   Scenes are drawn in code (engine.js + art.js + scenes.js), play only on screen, and stand still with reduced motion. */
:root{--night:#0E1252;--deep:#0A0D3E;--ice:#CDD6EE;--text:#DCE1F2;--steel:#8F97C6;--mint:#8CD6C3;--orange:#C9A48A;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;color:var(--text);font-family:"Newsreader",Georgia,serif;font-size:clamp(19px,1.35vw + 12px,23px);line-height:1.62;
  background:radial-gradient(120% 60% at 80% 0%,#2A33884a,transparent 60%),linear-gradient(180deg,#10145A 0%,var(--night) 30%,#0B0E44 100%);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
main{display:grid;justify-items:center;padding:0 0 18vh}
.col{width:min(640px,100% - 32px)}
/* the hero: the wallpaper come alive (scene 'hero', cover-fitted to the box), the title laid over its dark floor.
   The title is visible by default; only with JS and motion it waits for the flash (.intro), so it can never stay hidden. */
.hero{position:relative;width:100%;height:min(88vh,920px);min-height:560px;overflow:hidden;background:#0B0D1A;
  --bone:#ECE6DA;--jade:#8FC9B4;--slate:#7F88A6}
.hero .hero-cv{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
.hero-copy{position:absolute;left:0;right:0;bottom:clamp(36px,8vh,88px);margin:0 auto;width:min(1180px,100% - 32px);display:grid;gap:clamp(14px,2.2vh,24px);justify-items:start}
.hero .kicker,.hero .follow{margin:0;font:400 11px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.32em;text-transform:uppercase;color:var(--slate)}
.hero h1{margin:0;font:300 clamp(44px,6.6vw,108px)/1 "Cormorant Garamond",Georgia,serif;letter-spacing:-.01em;color:var(--bone)}
.hero h1 em{font:italic 300 1em/1 "Cormorant Garamond",Georgia,serif;letter-spacing:0;color:var(--jade);background:none;-webkit-text-fill-color:currentColor}
.hero .sub{margin:0;font:italic 300 clamp(19px,1.7vw,24px)/1.4 "Cormorant Garamond",Georgia,serif;color:var(--bone);opacity:.7}
.hero.intro .hero-copy > *{animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
.hero.intro .hero-copy > :nth-child(1){animation-delay:2.9s}.hero.intro .hero-copy > :nth-child(2){animation-delay:3.05s}
.hero.intro .hero-copy > :nth-child(3){animation-delay:3.3s}.hero.intro .hero-copy > :nth-child(4){animation-delay:3.6s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* ink to cobalt: the colour of the story arrives with the flash of scene 00 */
.hero + section{background:linear-gradient(180deg,#0B0D1A 0,#0B0D1A 2vh,transparent 46vh)}
@media (prefers-reduced-motion:reduce){.hero.intro .hero-copy > *{animation:none}}
.kicker{font:500 13px/1.4 "IBM Plex Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--steel)}
h1{margin:0;font:600 clamp(44px,7.4vw,96px)/.98 Inter,system-ui,sans-serif;letter-spacing:-.045em;color:#fff}
h1 em{font:italic 400 1.04em/1 "Newsreader",serif;letter-spacing:-.02em;background:linear-gradient(90deg,#5FF0D0,#D8FFF7);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;font-style:italic;color:var(--ice);opacity:.85;font-size:1.05em}
.glyph{font:500 clamp(18px,2.4vw,30px)/1.3 "IBM Plex Mono",monospace;color:var(--ice);opacity:.85;white-space:nowrap;letter-spacing:0}
.glyph b{color:var(--mint);font-weight:700;text-shadow:0 0 14px #8CD6C366}
.prose p{margin:0 0 1.05em}
.prose p:last-child{margin-bottom:0}
.prose strong{font-weight:400;color:#fff}
.prose em{color:var(--mint);font-style:italic}
.scene-label{font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--steel);margin:0 0 1.6em;display:flex;gap:.8em;align-items:center}
.scene-label::before{content:"";width:28px;height:1px;background:currentColor;opacity:.6}
section{display:grid;justify-items:center;width:100%;padding:9vh 0 0}
.kx-fig{margin:4vh 0 0;width:min(1320px,100vw);position:relative}
.kx{width:100%;aspect-ratio:16/10;display:block;background:transparent}
.flownote{margin:1.6em 0 1.2em;padding:1.1em 1.3em;border-left:2px solid var(--mint);background:linear-gradient(90deg,#8CD6C312,transparent);border-radius:0 12px 12px 0}
.flownote .tag{display:block;font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);margin-bottom:.7em}
.terrenal{font:300 clamp(26px,3.4vw,44px)/1.2 "Cormorant Garamond",Georgia,serif;letter-spacing:0;color:#F1EEE6;white-space:nowrap}
.terrenal i{font-style:italic;font-weight:400;color:var(--mint)}
footer{margin-top:14vh;text-align:center;display:grid;gap:18px;justify-items:center}
footer .firma{display:inline-flex;align-items:center;gap:14px}
footer .onda{width:46px;height:10px;fill:none;stroke:var(--mint);stroke-width:1.2;opacity:.7}
footer small{font:500 12px/1.5 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);opacity:.8}
/* a thought of the page: it opens like a mirage when you reach it (the heat-haze filter settles, an ellipse of light widens) */
.mirage{position:relative;margin:2.4em -1em 2.6em;padding:1.4em 1em;text-align:center;font:italic 300 clamp(23px,2.3vw,31px)/1.4 "Cormorant Garamond",Georgia,serif;color:#F1EEE6}
.mirage span{display:block}
.mirage .q{margin-top:.55em;font-weight:400;font-size:1.4em;color:#A9F2DF;letter-spacing:.01em}
.mirage::before{content:"";position:absolute;inset:-20% -10%;z-index:-1;background:radial-gradient(50% 50% at 50% 50%,#8CD6C314,transparent 70%);opacity:0;transition:opacity 2.8s ease}
.js-mirage .mirage{opacity:0;clip-path:ellipse(0% 0% at 50% 50%);filter:url(#haze) blur(6px);transition:clip-path 2.6s cubic-bezier(.2,.7,.2,1),opacity 1.8s ease,filter 2.8s ease}
.js-mirage .mirage.open{opacity:1;clip-path:ellipse(80% 150% at 50% 50%);filter:url(#haze) blur(0)}
.js-mirage .mirage.open::before{opacity:1}
.js-mirage .mirage.still{filter:none;clip-path:none}
/* bridge · between stations: the current carries you on. One line, the flowing wave before it. */
.bridge{display:flex;align-items:center;justify-content:center;gap:14px;margin:5vh auto 0;text-align:center;font:italic 300 clamp(19px,1.6vw,23px)/1.4 "Cormorant Garamond",Georgia,serif;color:#F1EEE6;opacity:.82}
.bridge .br-wave{flex:none;width:40px;height:10px;fill:none;stroke:var(--mint);overflow:hidden}
section:last-of-type .bridge{opacity:.95}
/* fn · a flownote that folds. Closed: a quiet divider, the flownote's mark breathing in the middle. Open: a parallel space.
   Markup: <div class="fn" data-fn><button class="fn-fold" aria-expanded aria-controls>…</button><div class="fn-body" id><div class="fn-inner">…</div></div></div> */
.fn{margin:2.2em 0 2.4em}
.fn-fold{display:flex;align-items:center;gap:14px;width:100%;padding:10px 0;background:none;border:0;cursor:pointer;color:var(--steel)}
.fn-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#8F97C64d 30%,#8F97C64d 70%,transparent)}
.fn-tag{font:400 11px/1 "IBM Plex Mono",monospace;letter-spacing:.3em;text-transform:uppercase;transition:color .6s ease}
/* the wave: a carrier that flows on (one wavelength per loop, so it never jumps), a soft pulse of energy riding it, a slow breath */
.fn-wave{width:40px;height:10px;fill:none;stroke:var(--mint);overflow:hidden;animation:fn-breath 5s ease-in-out infinite}
.fn-carrier{stroke-width:1.2;opacity:.5;animation:fn-flow 2.6s linear infinite}
.fn-pulse{stroke-width:1.6;stroke-linecap:round;stroke-dasharray:9 91;opacity:.95;filter:drop-shadow(0 0 2px #8CD6C3);animation:fn-flow 2.6s linear infinite,fn-run 3.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes fn-flow{to{transform:translateX(-20px)}}
@keyframes fn-run{from{stroke-dashoffset:60}to{stroke-dashoffset:-40}}
@keyframes fn-breath{50%{transform:scaleY(1.25)}}
.fn-fold:hover .fn-tag,.fn-fold:focus-visible .fn-tag,.fn.open .fn-tag{color:var(--mint)}
.fn-fold:focus-visible{outline:none}.fn-fold:focus-visible .fn-line{background:linear-gradient(90deg,transparent,#8CD6C380 30%,#8CD6C380 70%,transparent)}
.fn-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows 1.4s cubic-bezier(.3,.6,.2,1)}
.fn.open .fn-body{grid-template-rows:1fr}
.fn-inner{overflow:hidden;min-height:0}
.fn.open .fn-pulse{opacity:.6}
@media (prefers-reduced-motion:reduce){.fn-body{transition:none}.fn-wave,.fn-carrier,.fn-pulse{animation:none}}
.fn .mirage{margin:.4em 0 .6em;padding:1.6em .5em 1.2em}
/* the mirage is a door */
.mirage[role=button]{cursor:pointer;outline:none}
.mirage .door{margin-top:1.4em;font:400 11px/1 "IBM Plex Mono",monospace;font-style:normal;letter-spacing:.3em;text-transform:uppercase;color:var(--steel);opacity:0;transition:opacity 1.2s ease 2.4s}
.mirage.open .door,.mirage.still .door{opacity:.7}
.mirage[role=button]:hover .door,.mirage[role=button]:focus-visible .door{opacity:1;color:var(--mint)}
.mirage[role=button]:focus-visible{box-shadow:0 0 0 1px #8CD6C355;border-radius:18px}
/* the variant: the same journey, inside — it opens like the mirage, from where it was touched */
.variante{position:fixed;inset:0;z-index:50;background:radial-gradient(90% 50% at 50% 0%,#1A1F4E,transparent 70%),linear-gradient(180deg,#0B0D1A 0,#10145A 40vh,var(--night) 70%,#0B0E44 100%);color:var(--text);
  clip-path:circle(0% at var(--ox,50%) var(--oy,50%));opacity:0;transition:clip-path 1.6s cubic-bezier(.3,.6,.2,1),opacity .9s ease}
.variante.on{clip-path:circle(150% at var(--ox,50%) var(--oy,50%));opacity:1}
.v-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;display:grid;justify-items:center;padding:0 0 14vh}
.v-head{padding:16vh 0 2vh;display:grid;gap:22px}
.variante h2{margin:0;font:300 clamp(40px,6vw,88px)/1.02 "Cormorant Garamond",Georgia,serif;color:#F1EEE6}
.variante h2 em{font-style:italic;color:var(--mint)}
.v-lead{margin:0;font:italic 300 clamp(19px,1.7vw,24px)/1.45 "Cormorant Garamond",Georgia,serif;color:#F1EEE6;opacity:.75}
.v-beat{display:grid;justify-items:center;width:100%;padding:9vh 0 0}
.v-end{gap:6vh;padding-bottom:4vh}
.v-close,.v-back{font:400 11px/1 "IBM Plex Mono",monospace;letter-spacing:.3em;text-transform:uppercase;color:var(--steel);background:none;border:1px solid #8F97C640;border-radius:999px;padding:12px 18px;cursor:pointer}
.v-close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);right:18px;z-index:2;background:#0B0D1Acc;backdrop-filter:blur(8px)}
.v-close:hover,.v-back:hover,.v-close:focus-visible,.v-back:focus-visible{color:var(--mint);border-color:#8CD6C380;outline:none}
html.v-open,html.v-open body{overflow:hidden}
@media (prefers-reduced-motion:reduce){.variante{transition:none}}
@media (max-width:640px){
  .hero{height:min(78vh,700px);min-height:520px}
  .hero h1{font-size:34px;line-height:1.08}
  .kx-fig{width:100vw}
  .terrenal{white-space:normal}
}

/* duo · two minds side by side */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,40px);margin:.4em 0 0}
.duo p{margin:.5em 0 0;font:300 clamp(22px,2.2vw,30px)/1.3 "Cormorant Garamond",Georgia,serif;color:#F1EEE6}
.duo > div + div{border-left:1px solid #8F97C633;padding-left:clamp(18px,3vw,40px)}
.duo-who{font:400 11px/1.4 "IBM Plex Mono",monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--steel)}
.duo > div + div .duo-who{color:var(--mint)}
/* the close, and the shelf of other stories */
.close{margin:12vh auto 0;text-align:center;font:italic 300 clamp(26px,3vw,40px)/1.3 "Cormorant Garamond",Georgia,serif;color:#F1EEE6}
.shelf{margin:12vh auto 0;display:grid;gap:22px}
.shelf ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.shelf a{display:grid;gap:4px;padding:18px 20px;border:1px solid #8F97C630;border-radius:14px;text-decoration:none;color:inherit;transition:border-color .5s ease,background .5s ease}
.shelf a:hover,.shelf a:focus-visible{border-color:#8CD6C370;background:#8CD6C30a;outline:none}
.sh-t{font:300 clamp(24px,2.4vw,32px)/1.15 "Cormorant Garamond",Georgia,serif;color:#F1EEE6}
.sh-s{font:italic 300 18px/1.4 "Cormorant Garamond",Georgia,serif;color:#F1EEE6;opacity:.7}
.sh-c{font:400 10px/1 "IBM Plex Mono",monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--steel);margin-top:6px}
.mirage .door{display:inline-block;text-decoration:none;font:400 11px/1.4 "IBM Plex Mono",monospace;font-style:normal;letter-spacing:.24em;text-transform:uppercase;color:var(--steel)}
.mirage .door:hover,.mirage .door:focus-visible{color:var(--mint);outline:none}
.prose .terrenal{display:block}
@media (max-width:640px){.duo{grid-template-columns:1fr}.duo > div + div{border-left:0;padding-left:0;border-top:1px solid #8F97C633;padding-top:18px}}
</style></head><body>

.copyagent{
  color-scheme:light dark;
  /* color */
  --bg:light-dark(oklch(95% .01 85),oklch(18% .012 60));
  --surface:light-dark(oklch(98.5% .005 85),oklch(23% .015 60));
  --fg:light-dark(oklch(22% .02 60),oklch(95% .01 80));
  --muted:light-dark(oklch(46% .035 65),oklch(74% .03 70));
  --line:light-dark(oklch(85% .018 80),oklch(33% .02 60));
  --accent:light-dark(oklch(48% .12 55),oklch(82% .17 80));
  --on-accent:light-dark(oklch(98.5% .01 85),oklch(18% .03 60));
  --accent-2:light-dark(oklch(44% .075 205),oklch(78% .1 195));
  --on-accent-2:light-dark(oklch(98.5% .01 85),oklch(18% .03 60));
  --danger:light-dark(oklch(48% .17 25),oklch(75% .15 25));
  --on-danger:light-dark(oklch(98.5% .01 85),oklch(18% .03 60));
  /* terminal y bloques de código: oscuros en los dos temas */
  --term-bg:oklch(15% .012 60);
  --term-fg:oklch(93% .015 80);
  --term-muted:oklch(70% .03 70);
  --term-accent:oklch(82% .17 80);
  --term-accent-2:oklch(78% .1 195);
  /* tipografía */
  --font-display:"Bricolage Grotesque","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --font-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --step--1:clamp(.8rem,.78rem + .1vw,.875rem);
  --step-0:clamp(1rem,.96rem + .2vw,1.1rem);
  --step-1:clamp(1.25rem,1.1rem + .6vw,1.6rem);
  --step-2:clamp(1.6rem,1.3rem + 1.4vw,2.4rem);
  --step-3:clamp(2.2rem,1.5rem + 3vw,3.6rem);
  --step-5:clamp(2.6rem,1.2rem + 6.2vw,5.6rem);
  /* espaciado */
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.5rem;--space-6:2rem;--space-7:3rem;--space-8:5rem;
  /* radios */
  --radius-s:.3rem;--radius-m:.6rem;--radius-l:1rem;--radius-full:999px;
  /* sombras */
  --shadow-1:0 .5rem 1.25rem -.6rem oklch(20% .05 60 / .45);

  --dur-1:.15s;--dur-2:.25s;--dur-3:.5s;

  --ease-inout:cubic-bezier(.65,0,.35,1);
}
.copyagent[data-theme="light"]{color-scheme:light}
.copyagent[data-theme="dark"]{color-scheme:dark}
@media (prefers-reduced-motion:reduce){.copyagent{--dur-1:0s;--dur-2:0s;--dur-3:0s}}
/* "Copiar para tu agente": botón copiar (normal / hover / copiado / error) + panel "Ver qué se copia". */
.copyagent{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-4);font-family:var(--font-mono)}
.btn-copy{display:inline-flex;align-items:center;gap:.55rem;font:500 .875rem var(--font-mono);cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:var(--radius-m);padding:.7rem 1rem;transition:transform var(--dur-1) var(--ease-out),box-shadow var(--dur-1),background var(--dur-1)}
.btn-copy:hover{transform:translateY(-2px);box-shadow:var(--shadow-1)}
.btn-copy:focus-visible,.copyagent summary:focus-visible,.peek-tabs button:focus-visible,.peek-close:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn-copy svg{width:1.1em;height:1.1em;flex:none}
.btn-copy .i-ok,.btn-copy .i-err{display:none}
.btn-copy[data-state="done"]{background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent-2)}
.btn-copy[data-state="error"]{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn-copy[data-state="done"] .i-copy,.btn-copy[data-state="error"] .i-copy{display:none}
.btn-copy[data-state="done"] .i-ok,.btn-copy[data-state="error"] .i-err{display:block}
.btn-copy--sm{padding:.4rem .7rem;font-size:.75rem;gap:.4rem}
.code .btn-copy{background:oklch(100% 0 0 / .1);border-color:transparent;color:var(--term-fg)}
.code .btn-copy:hover{background:oklch(100% 0 0 / .2)}
.code .btn-copy[data-state="done"]{background:var(--accent-2);color:var(--on-accent-2)}
.code .btn-copy[data-state="error"]{background:var(--danger);color:var(--on-danger)}
.copyagent .live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.copyagent details.peek{display:contents}
.copyagent:not(.is-float) details.peek::details-content{flex:1 1 100%;min-width:0}
.copyagent summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;font:500 .85rem var(--font-mono);color:var(--muted);padding:.7rem .3rem;border-radius:var(--radius-s)}
.copyagent summary::-webkit-details-marker{display:none}
.copyagent summary::before{content:"";width:.45em;height:.45em;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform var(--dur-2) var(--ease-out)}
.copyagent summary:hover{color:var(--fg)}
.copyagent details[open] summary::before{transform:rotate(45deg)}
.peek-panel{flex:1 1 100%;min-width:0;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow-2);overflow:hidden;font-family:var(--font-body)}
.peek-bar{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--line);flex-wrap:wrap}
.peek-tabs{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;margin-right:auto}
